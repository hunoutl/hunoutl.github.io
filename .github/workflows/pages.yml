name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Ne jamais interrompre un déploiement Pages en cours (recommandation GitHub).
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fichier unique tout-inline (cf. tools/build.mjs) : condition pour
      # que le prefetch cross-site du document suffise à l'arrivée.
      - run: |
          for f in scripts/*.js tools/*.mjs; do node --check "$f"; done
          node tools/build.mjs
          mkdir -p _site
          cp dist/index.html robots.txt sitemap.xml _site/
          cp -r assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
