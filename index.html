<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hunoutl — AI/HPC Engineer</title>
  <meta name="description" content="Léo Hunout, AI/HPC infrastructure engineer. Swipe right for the plain-language version." />
  <meta property="og:title" content="hunoutl — AI/HPC Engineer" />
  <meta property="og:description" content="4+ years building large-scale AI/HPC compute infrastructure." />
  <link rel="preconnect" href="https://hunoutl.gitlab.io" />
  <!-- Précharge les ressources du site miroir dès le scanner de préchargement
       du navigateur (donc en parallèle du tout premier rendu de CETTE page,
       bien avant que le JS ne s'exécute) : au moment où l'iframe caché du
       site miroir se crée, ces fichiers sont déjà en cache, ce qui rend le
       geste de bascule encore plus immédiat.
       NE PAS SUPPRIMER : ces prefetch ont été retirés une fois, au motif que
       le cache HTTP partitionné par site de premier niveau les rendrait
       inutiles pour l'iframe (contexte tiers). Constaté en conditions
       réelles sur smartphone : sans eux, le site cible clignote pendant son
       chargement au moment de la bascule. Ils servent donc bel et bien. -->
  <link rel="prefetch" href="https://hunoutl.gitlab.io/" as="document" />
  <link rel="prefetch" href="https://hunoutl.gitlab.io/styles/facade.css" as="style" crossorigin />
  <link rel="prefetch" href="https://hunoutl.gitlab.io/scripts/content.js" as="script" crossorigin />
  <link rel="prefetch" href="https://hunoutl.gitlab.io/scripts/lang-switch.js" as="script" crossorigin />
  <link rel="prefetch" href="https://hunoutl.gitlab.io/scripts/drag-swipe.js" as="script" crossorigin />
  <link rel="prefetch" href="https://hunoutl.gitlab.io/assets/me.webp" as="image" crossorigin />
  <link rel="stylesheet" href="styles/machine.css" />
  <style>
    html { background: #0b0e0c; }
  </style>
  <script>
    // Synchrone, avant le CSS/JS externe : si on arrive via le swipe
    // (payload transmis dans window.name, pas dans l'URL), masquer tout
    // de suite pour éviter tout flash avant que drag-swipe.js repositionne
    // le scroll. Lecture seule ici — le nettoyage définitif se fait dans
    // drag-swipe.js (handleArrival), une seule fois.
    if (window.name && window.name.indexOf('"from":"drag"') !== -1) {
      document.documentElement.style.visibility = "hidden";
    }
  </script>
</head>
<body>
  <header class="site-bar">
    <button id="lang-switch" class="lang-switch" type="button">FR</button>
    <a id="mirror-hint" class="mirror-hint" data-mirror-link href="#" data-floor-id="hero"></a>
  </header>

  <main id="floors"></main>

  <script src="scripts/content.js"></script>
  <script src="scripts/lang-switch.js"></script>
  <script src="scripts/drag-swipe.js"></script>
</body>
</html>
