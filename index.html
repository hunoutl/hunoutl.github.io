<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Couleur du canevas par défaut AVANT tout CSS : le premier frame peint
       après la navigation cross-site n'est jamais blanc par défaut. -->
  <!-- .no-js → .js avant tout rendu : les étages pré-générés au build
       (lisibles sans JS) sont masqués, lang-switch.js les remplace. -->
  <script>document.documentElement.className = "js";</script>
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <title>hunoutl</title>
  <meta name="description" content="Léo Hunout (hunoutl), AI/HPC engineer: supercomputers, GPU clusters and large-scale model training (Jean Zay, Dalia, AWS EKS). The wireframe side of an ink sea chart." />
  <link rel="canonical" href="https://hunoutl.github.io/" />
  <!-- Paire FR (gitlab.io) / EN (github.io) : même CV, deux faces. -->
  <link rel="alternate" hreflang="fr" href="https://hunoutl.gitlab.io/" />
  <link rel="alternate" hreflang="en" href="https://hunoutl.github.io/" />
  <link rel="alternate" hreflang="x-default" href="https://hunoutl.gitlab.io/" />
  <meta property="og:type" content="profile" />
  <meta property="og:url" content="https://hunoutl.github.io/" />
  <meta property="og:site_name" content="Léo Hunout" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="fr_FR" />
  <meta property="og:title" content="Léo Hunout (hunoutl) — AI/HPC Engineer" />
  <meta property="og:description" content="5+ years building and running large-scale AI/HPC compute infrastructure: Jean Zay, Dalia, AWS EKS." />
  <meta property="og:image" content="https://hunoutl.github.io/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Wireframe of a sea chart with simulation overlays, titled hunoutl" />
  <meta property="profile:first_name" content="Léo" />
  <meta property="profile:last_name" content="Hunout" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Léo Hunout",
    "alternateName": "hunoutl",
    "jobTitle": "AI/HPC Engineer",
    "url": "https://hunoutl.github.io/",
    "worksFor": {
      "@type": "Organization",
      "name": "Aneo",
      "url": "https://www.aneo.eu/"
    },
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "INSA Centre Val de Loire"
    },
    "knowsAbout": [
      "HPC",
      "GPU clusters",
      "distributed training",
      "Slurm",
      "Kubernetes",
      "AWS EKS",
      "Ray",
      "PyTorch",
      "LLM"
    ],
    "sameAs": [
      "https://www.linkedin.com/in/leo-hunout",
      "https://github.com/hunoutl",
      "https://gitlab.com/hunoutl",
      "https://huggingface.co/hunoutl",
      "https://hunoutl.gitlab.io/"
    ]
  }
  </script>
  <link rel="stylesheet" href="styles/machine.css" />
  <style>
    html { background: #020604; }
  </style>
  <!-- Bloque le premier rendu jusqu'à ce que #render-ready (après les
       scripts, en fin de body) soit parsé : le premier frame peint contient
       donc déjà le contenu, la simulation dessinée et la position de scroll
       d'arrivée. Chromium 124+ ; ignoré ailleurs. -->
  <link rel="expect" href="#render-ready" blocking="render" />
</head>
<body>
  <canvas id="sea" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="clouds" aria-hidden="true"></div>
  <header class="site-bar">
    <div class="bar-group">
      <button id="lang-switch" class="lang-switch" type="button">FR</button>
      <button id="motion-toggle" class="bar-btn motion-toggle" type="button" aria-pressed="false" hidden><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path class="i-pause" d="M4 3h3v10H4zM9 3h3v10H9z"/><path class="i-play" d="M5 3l8 5-8 5z"/></svg></button>
    </div>
    <span class="brand">hunoutl</span>
    <div class="bar-group">
      <button id="cv-soon" class="bar-btn cv-soon" type="button">CV</button>
      <a id="mirror-hint" class="mirror-hint" data-mirror-link href="https://hunoutl.gitlab.io/">← The map</a>
    </div>
    <p id="bar-toast" class="bar-toast" role="status" aria-live="polite"></p>
  </header>

  <main id="floors"></main>

  <script src="scripts/site.js"></script>
  <script src="scripts/floor-fit.js"></script>
  <script src="scripts/geo.js"></script>
  <script src="scripts/content.js"></script>
  <script src="scripts/lang-switch.js"></script>
  <script src="scripts/sim-core.js"></script>
  <script src="scripts/bar.js"></script>
  <script src="scripts/render-machine.js"></script>
  <script src="scripts/drag-swipe.js"></script>
  <script>SIM.start();</script>
  <div id="render-ready" hidden></div>
</body>
</html>
