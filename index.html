<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Couleur du canevas par défaut AVANT tout CSS : le premier frame peint
       après la navigation cross-site n'est jamais blanc par défaut. -->
  <meta name="color-scheme" content="dark" />
  <title>hunoutl — the computation under the matter</title>
  <meta name="description" content="Léo Hunout, AI/HPC infrastructure engineer. The same world as the human side, shown as the numerical simulation it is. Swipe right for the plain-language version." />
  <meta property="og:title" content="hunoutl — AI/HPC Engineer" />
  <meta property="og:description" content="4+ years building large-scale AI/HPC compute infrastructure." />
  <link rel="stylesheet" href="styles/machine.css" />
  <style>
    html { background: #05070b; }
  </style>
  <!-- Bloque le premier rendu jusqu'à ce que #render-ready (après les
       scripts, en fin de body) soit parsé : le premier frame peint contient
       donc déjà le contenu rendu par JS, la simulation dessinée et la
       position de scroll d'arrivée. Chromium 124+ ; ignoré ailleurs. -->
  <link rel="expect" href="#render-ready" blocking="render" />
</head>
<body>
  <canvas id="sim" aria-hidden="true"></canvas>
  <header class="site-bar">
    <button id="lang-switch" class="lang-switch" type="button">FR</button>
    <span class="brand">hunoutl<span>@</span>hpc <em data-hud="barstep"></em></span>
    <a id="mirror-hint" class="mirror-hint" data-mirror-link href="#" data-floor-id="hero"></a>
  </header>

  <main id="floors"></main>

  <script src="scripts/content.js"></script>
  <script src="scripts/lang-switch.js"></script>
  <script src="scripts/sim-core.js"></script>
  <script src="scripts/render-machine.js"></script>
  <script src="scripts/drag-swipe.js"></script>
  <script>SIM.start();</script>
  <div id="render-ready" hidden></div>
</body>
</html>
